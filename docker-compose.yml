version: '3.8'

services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: datapilot

  web:
    x-develop:
      watch:
        - '**/*.py'
        - '**/*.html'
        - '**/*.css'
    build: .
    command: python manage.py runserver 0.0.0.0:9090
    volumes:
      - .:/app
    ports:
      - "9090:9090"
    depends_on:
      - db

volumes:
  postgres_data:
