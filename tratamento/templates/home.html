{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tratamento de Dados</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Automação de Tratamento de Dados</h1>

        <div class="card p-4 shadow">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="arquivo" class="form-label">Selecione um arquivo CSV:</label>
                    <input type="file" class="form-control" name="arquivo" required>
                </div>

                <div class="mb-3">
                    <label for="funcao" class="form-label">Escolha a função:</label>
                    <select class="form-select" name="funcao">
                        <option value="exibir_info">Exibir Informações</option>
                        <option value="exibir_head">Exibir Cabeçalho</option>
                        <option value="exibir_describe">Exibir Estatísticas</option>
                        <option value="contar_valores_nulos">Contar Valores Nulos</option>
                        <option value="remover_valores_nulos">Remover Valores Nulos</option>
                        <option value="calcular_correlacao">Calcular Correlação</option>
                        <option value="plotar_heatmap_correlacao">Plotar Heatmap de Correlação</option>
                        <option value="correlacao_com_variavel">Correlação com Variável</option>
                        <option value="filtrar_variaveis">Filtrar Variáveis</option>
                        <option value="plotar_histograma">Plotar Histograma</option>
                        <option value="dividir_dados_treino_teste">Dividir Dados Treino/Teste</option>
                        <option value="padronizar_dados">Padronizar Dados</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="variavel" class="form-label">Variável (se necessário):</label>
                    <input type="text" class="form-control" name="variavel">
                </div>

                <div class="mb-3">
                    <label for="variaveis" class="form-label">Lista de Variáveis (se necessário, separadas por vírgula):</label>
                    <input type="text" class="form-control" name="variaveis">
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Executar</button>
                </div>
            </form>
        </div>

        {% if resultado %}
            <div class="mt-4 p-3 bg-light border rounded">
                <h2 class="text-success">Resultado:</h2>
                <div>{{ resultado|safe }}</div>
            </div>
        {% endif %}

        {% if erro %}
            <div class="mt-4 p-3 bg-danger text-white border rounded">
                <h2>Erro:</h2>
                <p>{{ erro }}</p>
            </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
